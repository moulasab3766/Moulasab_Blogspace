<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a story — BlogSpace</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header><a class="brand" href="index.html">✳ BlogSpace</a><a href="dashboard.html">← Back to dashboard</a></header><main class="auth editor"><section class="panel"><small>THE WORLD IS LISTENING</small><h1 id="editor-heading">Write your story.</h1><form id="post-form" novalidate><label>Story title<input name="title" required minlength="3" maxlength="120"></label><label>Category<select name="category" required><option value="">Choose a category</option><option>Technology</option><option>Lifestyle</option><option>Learning</option><option>Design</option><option>Career</option></select></label><label>Reading time<select name="readTime"><option>3 min read</option><option selected>5 min read</option><option>7 min read</option><option>10 min read</option></select></label><label>Short summary<textarea name="excerpt" required minlength="15" maxlength="180"></textarea></label><label>Your story<textarea name="content" rows="8" required minlength="20"></textarea></label><p class="form-message" role="alert"></p><button class="button" type="submit">Publish story ↗</button></form></section></main></body></html>
