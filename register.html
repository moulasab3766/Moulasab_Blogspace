<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — BlogSpace</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header><a class="brand" href="index.html">✳ BlogSpace</a><a href="index.html">← Back to stories</a></header><main class="auth"><section class="panel"><small>JOIN THE COMMUNITY</small><h1>Your story starts here.</h1><form id="register-form" novalidate><label>Your name<input name="name" required minlength="2" maxlength="60" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" minlength="8" required autocomplete="new-password"></label><p class="form-message" role="alert"></p><button class="button" type="submit">Create account →</button></form><p>Already have an account? <a href="login.html">Log in</a></p><small>Passwords are hashed by the backend before being stored.</small></section></main></body></html>
